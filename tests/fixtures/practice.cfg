// ============================================================
// PLAJIW - CS2 PRACTICE CONFIG
// ============================================================
// Local/private server practice environment.
//
// Load:
//     exec practice.cfg
//
// Return to normal config:
//     exec autoexec.cfg
//
// ============================================================


// ============================================================
// SERVER / CHEATS
// ============================================================

sv_cheats "1"

mp_limitteams "0"
mp_autoteambalance "0"
mp_ignore_round_win_conditions "1"

mp_team_intro_time "0"
mp_freezetime "0"
mp_round_restart_delay "1"

mp_warmup_end


// ============================================================
// ROUND TIME
// ============================================================

// Long rounds for uninterrupted practice.
mp_roundtime "60"
mp_roundtime_defuse "60"
mp_roundtime_hostage "60"

mp_c4timer "40"


// ============================================================
// ECONOMY / BUYING
// ============================================================

mp_maxmoney "60000"
mp_startmoney "60000"
mp_afterroundmoney "60000"

mp_buytime "9999"
mp_buy_anywhere "1"

mp_free_armor "2"


// ============================================================
// RESPAWN
// ============================================================

mp_respawn_on_death_ct "1"
mp_respawn_on_death_t "1"


// ============================================================
// AMMO / GRENADES
// ============================================================

// 1 = infinite magazine, no reload required.
// 2 = infinite reserve ammo, reload normally.
sv_infinite_ammo "1"

ammo_grenade_limit_total "5"
ammo_grenade_limit_flashbang "2"


// ============================================================
// GRENADE PRACTICE
// ============================================================

// Picture-in-picture grenade trajectory preview.
sv_grenade_trajectory_prac_pipreview "1"

// How long the trajectory trail remains visible.
sv_grenade_trajectory_prac_trailtime "8"


// ============================================================
// BULLET IMPACTS / WALLBANG PRACTICE
// ============================================================

sv_showimpacts "1"
sv_showimpacts_time "5"


// ============================================================
// PLAYER SURVIVABILITY
// ============================================================

// Health regenerates during practice.
sv_regeneration_force_on "1"

// Prevent accidental death while testing grenades / positions.
buddha "1"
buddha_ignore_bots "1"


// ============================================================
// BOTS
// ============================================================

bot_kick

bot_difficulty "3"

// Bots remain stationary by default.
bot_stop "1"

// Prevent bots from shooting while setting up positions.
bot_dont_shoot "1"


// ============================================================
// PRACTICE ALIASES
// ============================================================


// ------------------------------------------------------------
// Infinite Ammo
// ------------------------------------------------------------

// Infinite magazine / no reload.
alias "ammo_infinite" "sv_infinite_ammo 1; echo [PRACTICE] Infinite ammo"

// Infinite reserve, but normal reload mechanics.
alias "ammo_reload" "sv_infinite_ammo 2; echo [PRACTICE] Infinite reserve + reload"

// Normal ammunition.
alias "ammo_normal" "sv_infinite_ammo 0; echo [PRACTICE] Normal ammo"


// ------------------------------------------------------------
// Bots
// ------------------------------------------------------------

alias "bots_freeze" "bot_stop 1; bot_dont_shoot 1; echo [PRACTICE] Bots frozen"

alias "bots_move" "bot_stop 0; bot_dont_shoot 1; echo [PRACTICE] Bots moving"

alias "bots_combat" "bot_stop 0; bot_dont_shoot 0; echo [PRACTICE] Bots enabled"

alias "bots_clear" "bot_kick; echo [PRACTICE] Bots removed"

alias "bot_t" "bot_add_t; echo [PRACTICE] T bot added"

alias "bot_ct" "bot_add_ct; echo [PRACTICE] CT bot added"


// ------------------------------------------------------------
// Bullet impacts
// ------------------------------------------------------------

alias "impacts_on" "sv_showimpacts 1; echo [PRACTICE] Bullet impacts ON"

alias "impacts_off" "sv_showimpacts 0; echo [PRACTICE] Bullet impacts OFF"


// ------------------------------------------------------------
// Grenade trajectory
// ------------------------------------------------------------

alias "trajectory_on" "sv_grenade_trajectory_prac_pipreview 1; echo [PRACTICE] Grenade preview ON"

alias "trajectory_off" "sv_grenade_trajectory_prac_pipreview 0; echo [PRACTICE] Grenade preview OFF"


// ------------------------------------------------------------
// Damage
// ------------------------------------------------------------

alias "immortal" "buddha 1; sv_regeneration_force_on 1; echo [PRACTICE] Damage protection ON"

alias "mortal" "buddha 0; sv_regeneration_force_on 0; echo [PRACTICE] Damage protection OFF"


// ============================================================
// PRACTICE BINDS
// ============================================================
//
// ALT       -> Noclip
//
// F1        -> Place bot
// F2        -> Add T bot
// F3        -> Add CT bot
// F4        -> Freeze/unfreeze bots
//
// F5        -> Toggle bullet impacts
// F6        -> Toggle grenade trajectory preview
// F7        -> Rethrow last grenade
// F8        -> Remove smoke
//
// F9        -> Infinite ammo
// F10       -> Infinite reserve + normal reload
//
// F11       -> Restart round
// F12       -> Restore autoexec
//
// ============================================================


// ------------------------------------------------------------
// Movement / Positioning
// ------------------------------------------------------------

bind "ALT" "noclip"


// ------------------------------------------------------------
// Bots
// ------------------------------------------------------------

bind "F1" "bot_place"

bind "F2" "bot_add_t"
bind "F3" "bot_add_ct"

bind "F4" "toggle bot_stop 0 1"


// ------------------------------------------------------------
// Bullet Practice
// ------------------------------------------------------------

bind "F5" "toggle sv_showimpacts 0 1"


// ------------------------------------------------------------
// Grenade Practice
// ------------------------------------------------------------

bind "F6" "toggle sv_grenade_trajectory_prac_pipreview 0 1"

bind "F7" "sv_rethrow_last_grenade"

// Remove active smoke immediately.
bind "F8" "ent_fire smokegrenade_projectile kill; stopsound"


// ------------------------------------------------------------
// Ammo Practice
// ------------------------------------------------------------

bind "F9" "sv_infinite_ammo 1"

bind "F10" "sv_infinite_ammo 2"


// ------------------------------------------------------------
// Session Control
// ------------------------------------------------------------

bind "F11" "mp_restartgame 1"

// Restore your normal settings and binds.
bind "F12" "exec autoexec"


// ============================================================
// EXTRA COMMANDS
// ============================================================
//
// Useful commands that can be manually entered in console:
//
// bot_place
//     Places a bot where you are looking.
//
// bot_kick
//     Removes all bots.
//
// bot_kill
//     Kills all bots.
//
// bot_stop 1
//     Freezes bots.
//
// bot_stop 0
//     Allows bots to move.
//
// bot_dont_shoot 1
//     Prevents bots from shooting.
//
// bot_dont_shoot 0
//     Allows bots to shoot.
//
// bot_mimic 1
//     Bot reproduces your movement.
//
// bot_mimic 0
//     Stops bot mimic.
//
// bot_mimic_yaw_offset 180
//     Bot faces the opposite direction while mimicking.
//
// bot_crouch 1
//     Forces bots to crouch.
//
// bot_crouch 0
//     Restores normal bot stance.
//
// sv_rethrow_last_grenade
//     Repeats the last grenade throw.
//
// sv_showimpacts 1
//     Shows bullet impacts.
//
// sv_grenade_trajectory_prac_pipreview 1
//     Shows grenade trajectory preview.
//
// weapon_accuracy_nospread 1
//     Removes random bullet spread.
//     Useful for studying recoil/wallbang behavior.
//
// weapon_accuracy_nospread 0
//     Restores normal spread.
//
// ============================================================


// ============================================================
// APPLY CONFIG
// ============================================================

mp_restartgame "1"


// ============================================================
// LOAD CONFIRMATION / HELP
// ============================================================

clear

echo ""
echo "============================================================"
echo "                 PLAJIW - PRACTICE MODE"
echo "============================================================"
echo ""
echo " ALT  -> Noclip"
echo ""
echo " F1   -> Place bot"
echo " F2   -> Add T bot"
echo " F3   -> Add CT bot"
echo " F4   -> Freeze / release bots"
echo ""
echo " F5   -> Bullet impacts"
echo " F6   -> Grenade trajectory preview"
echo " F7   -> Rethrow last grenade"
echo " F8   -> Remove smoke"
echo ""
echo " F9   -> Infinite ammo / no reload"
echo " F10  -> Infinite reserve / normal reload"
echo ""
echo " F11  -> Restart round"
echo " F12  -> Restore autoexec"
echo ""
echo " Additional aliases:"
echo " bots_freeze"
echo " bots_move"
echo " bots_combat"
echo " bots_clear"
echo " bot_t"
echo " bot_ct"
echo " ammo_infinite"
echo " ammo_reload"
echo " ammo_normal"
echo " impacts_on / impacts_off"
echo " trajectory_on / trajectory_off"
echo " immortal / mortal"
echo ""
echo "============================================================"
echo "               PRACTICE CONFIG LOADED"
echo "============================================================"
echo ""