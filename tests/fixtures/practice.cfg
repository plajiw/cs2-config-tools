// CS2 Config Tools - Generic Practice Config
// ============================================================
// Local/private server practice environment.
//
// Load:
//     exec practice
//
// Return to your normal configuration:
//     exec autoexec
//
// This file intentionally contains practice/cheat commands.
// ============================================================

// ============================================================
// SERVER / ROUND
// ============================================================

sv_cheats "1"

mp_limitteams "0"
mp_autoteambalance "0"
mp_ignore_round_win_conditions "1"

mp_team_intro_time "0"
mp_freezetime "0"
mp_round_restart_delay "1"

mp_roundtime "60"
mp_roundtime_defuse "60"
mp_roundtime_hostage "60"

mp_warmup_end

// ============================================================
// ECONOMY / BUYING
// ============================================================

mp_maxmoney "60000"
mp_startmoney "60000"
mp_afterroundmoney "60000"

mp_buytime "9999"
mp_buy_anywhere "1"

mp_free_armor "2"

// ============================================================
// RESPAWN
// ============================================================

mp_respawn_on_death_ct "1"
mp_respawn_on_death_t "1"

// ============================================================
// AMMO / GRENADES
// ============================================================

// 1 = infinite active-weapon ammo.
// 2 = infinite reserve ammo while preserving normal reloads.
sv_infinite_ammo "1"

ammo_grenade_limit_total "5"
ammo_grenade_limit_flashbang "2"

// ============================================================
// GRENADE PRACTICE
// ============================================================

sv_grenade_trajectory_prac_pipreview "1"
sv_grenade_trajectory_prac_trailtime "8"

// ============================================================
// BULLET / WALLBANG PRACTICE
// ============================================================

// 0 = off
// 1 = client + server impacts
// 2 = client only
// 3 = server only
sv_showimpacts "1"
sv_showimpacts_time "5"

// ============================================================
// SURVIVABILITY
// ============================================================

sv_regeneration_force_on "1"

buddha "1"
buddha_ignore_bots "1"

// ============================================================
// BOTS
// ============================================================

bot_kick
bot_difficulty "3"

bot_stop "1"
bot_dont_shoot "1"

// ============================================================
// PRACTICE ALIASES
// ============================================================

// Ammo modes
alias "practice_ammo_infinite" "sv_infinite_ammo 1; echo [PRACTICE] Infinite active-weapon ammo"
alias "practice_ammo_reload" "sv_infinite_ammo 2; echo [PRACTICE] Infinite reserve ammo + normal reload"
alias "practice_ammo_normal" "sv_infinite_ammo 0; echo [PRACTICE] Normal ammo"

// Bot modes
alias "practice_bots_freeze" "bot_stop 1; bot_dont_shoot 1; echo [PRACTICE] Bots frozen"
alias "practice_bots_move" "bot_stop 0; bot_dont_shoot 1; echo [PRACTICE] Bots moving, shooting disabled"
alias "practice_bots_combat" "bot_stop 0; bot_dont_shoot 0; echo [PRACTICE] Bots moving and shooting"
alias "practice_bots_clear" "bot_kick; echo [PRACTICE] Bots removed"

// Visual helpers
alias "practice_impacts_on" "sv_showimpacts 1; echo [PRACTICE] Bullet impacts ON"
alias "practice_impacts_off" "sv_showimpacts 0; echo [PRACTICE] Bullet impacts OFF"

alias "practice_trajectory_on" "sv_grenade_trajectory_prac_pipreview 1; echo [PRACTICE] Grenade preview ON"
alias "practice_trajectory_off" "sv_grenade_trajectory_prac_pipreview 0; echo [PRACTICE] Grenade preview OFF"

// Damage protection
alias "practice_buddha_on" "buddha 1; sv_regeneration_force_on 1; echo [PRACTICE] Damage protection ON"
alias "practice_buddha_off" "buddha 0; sv_regeneration_force_on 0; echo [PRACTICE] Damage protection OFF"

// ============================================================
// PRACTICE BINDS
// ============================================================
//
// ALT  -> Noclip
//
// F1   -> Place bot
// F2   -> Add T bot
// F3   -> Add CT bot
// F4   -> Freeze / release bots
//
// F5   -> Toggle bullet impacts
// F6   -> Toggle grenade trajectory preview
// F7   -> Rethrow last grenade
// F8   -> Remove active smoke
//
// F9   -> Infinite ammo
// F10  -> Infinite reserve + normal reload
//
// F11  -> Restart round
// F12  -> Restore autoexec
//
// ============================================================

// Movement / positioning
bind "ALT" "noclip"

// Bots
bind "F1" "bot_place"
bind "F2" "bot_add_t"
bind "F3" "bot_add_ct"
bind "F4" "toggle bot_stop 0 1"

// Bullet practice
bind "F5" "toggle sv_showimpacts 0 1"

// Grenade practice
bind "F6" "toggle sv_grenade_trajectory_prac_pipreview 0 1"
bind "F7" "sv_rethrow_last_grenade"
bind "F8" "ent_fire smokegrenade_projectile kill; stopsound"

// Ammo
bind "F9" "sv_infinite_ammo 1"
bind "F10" "sv_infinite_ammo 2"

// Session
bind "F11" "mp_restartgame 1"
bind "F12" "exec autoexec"

// ============================================================
// OPTIONAL CONSOLE COMMANDS
// ============================================================
//
// bot_place
//     Place an existing bot where you are aiming.
//
// bot_add_t
// bot_add_ct
//     Add a bot to the selected team.
//
// bot_kick
//     Remove bots.
//
// bot_kill
//     Kill bots.
//
// bot_stop 1
// bot_stop 0
//     Freeze / release bots.
//
// bot_dont_shoot 1
// bot_dont_shoot 0
//     Disable / enable bot shooting.
//
// bot_mimic 1
// bot_mimic 0
//     Enable / disable movement mimic.
//
// bot_mimic_yaw_offset 180
//     Adjust mimic facing offset.
//
// bot_crouch 1
// bot_crouch 0
//     Force / release bot crouching.
//
// sv_rethrow_last_grenade
//     Repeat the last grenade throw.
//
// sv_showimpacts 1
//     Show client/server bullet impacts.
//
// sv_grenade_trajectory_prac_pipreview 1
//     Enable grenade trajectory practice preview.
//
// weapon_accuracy_nospread 1
// weapon_accuracy_nospread 0
//     Disable / restore random weapon spread for controlled tests.
//
// ============================================================

// ============================================================
// APPLY
// ============================================================

mp_restartgame "1"

// ============================================================
// LOAD CONFIRMATION
// ============================================================

clear

echo ""
echo "============================================================"
echo "        CS2 CONFIG TOOLS - PRACTICE CONFIG LOADED"
echo "============================================================"
echo ""
echo " ALT  -> Noclip"
echo ""
echo " F1   -> Place bot"
echo " F2   -> Add T bot"
echo " F3   -> Add CT bot"
echo " F4   -> Freeze / release bots"
echo ""
echo " F5   -> Bullet impacts"
echo " F6   -> Grenade trajectory preview"
echo " F7   -> Rethrow last grenade"
echo " F8   -> Remove active smoke"
echo ""
echo " F9   -> Infinite ammo"
echo " F10  -> Infinite reserve + reload"
echo ""
echo " F11  -> Restart round"
echo " F12  -> Restore autoexec"
echo ""
echo " Aliases:"
echo " practice_ammo_infinite / practice_ammo_reload / practice_ammo_normal"
echo " practice_bots_freeze / practice_bots_move / practice_bots_combat"
echo " practice_bots_clear"
echo " practice_impacts_on / practice_impacts_off"
echo " practice_trajectory_on / practice_trajectory_off"
echo " practice_buddha_on / practice_buddha_off"
echo ""
echo "============================================================"
