// CS2 Config Tools - Generic Autoexec Example
// ============================================================
// A conservative example using common player settings and binds.
// Intended as a sample/fixture, not as a universal "best" config.
// ============================================================

// ============================================================
// GENERAL
// ============================================================

con_enable "true"

fps_max "400"
fps_max_ui "120"

mm_dedicated_search_maxping "60"

r_player_visibility_mode "true"
r_drawtracers_firstperson "true"

// ============================================================
// TELEMETRY
// ============================================================

cl_hud_telemetry_frametime_show "1"
cl_hud_telemetry_ping_show "1"
cl_hud_telemetry_net_misdelivery_show "1"

// ============================================================
// MOVEMENT
// ============================================================

bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"

bind "CTRL" "+duck"
bind "SHIFT" "+sprint"

bind "SPACE" "+jump"
bind "MWHEELDOWN" "+jump"

// ============================================================
// COMBAT / ACTIONS
// ============================================================

bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "player_ping"

bind "r" "+reload"
bind "e" "+use"
bind "g" "drop"
bind "q" "lastinv"
bind "f" "+lookatweapon"

// ============================================================
// WEAPONS / GRENADES
// ============================================================

bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"

bind "z" "slot10"
bind "x" "slot8"
bind "c" "slot7"

// ============================================================
// COMMUNICATION
// ============================================================

bind "v" "+voicerecord"
bind "y" "messagemode"
bind "u" "messagemode2"

// ============================================================
// INTERFACE
// ============================================================

bind "TAB" "+showscores"
bind "b" "buymenu"
bind "`" "toggleconsole"
bind "t" "+spray_menu"

// ============================================================
// BUY BINDS
// ============================================================

bind "kp_1" "buy deagle"
bind "kp_2" "buy m4a1; buy ak47"
bind "kp_3" "buy awp"

bind "kp_0" "buy vest"
bind "kp_del" "buy vesthelm"

bind "kp_divide" "buy smokegrenade"
bind "kp_multiply" "buy hegrenade"
bind "kp_minus" "buy flashbang"
bind "kp_plus" "buy molotov; buy incgrenade"
bind "kp_enter" "buy defuser"

// ============================================================
// PRACTICE
// ============================================================

bind "p" "exec practice.cfg"

// ============================================================
// MOUSE
// ============================================================

sensitivity "1.00"
zoom_sensitivity_ratio "1.00"

// ============================================================
// AUDIO
// ============================================================

volume "0.40"
snd_voipvolume "0.70"
snd_mute_losefocus "false"

snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundend_volume "0"
snd_mvp_volume "0"
snd_tensecondwarning_volume "0.10"

// ============================================================
// CROSSHAIR
// ============================================================

cl_crosshairstyle "4"

cl_crosshair_length "8"
cl_crosshair_thickness "2"
cl_crosshair_gap "4"

cl_crosshairdot "false"
cl_crosshair_t "false"
cl_crosshair_recoil "false"

cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "0"
cl_crosshaircolor_a "255"

cl_crosshair_drawoutline "1"

// ============================================================
// VIEWMODEL
// ============================================================

viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"

// ============================================================
// RADAR
// ============================================================

cl_hud_radar_scale "1.0"
cl_radar_always_centered "0"
cl_radar_icon_scale_min "0.6"
cl_radar_rotate "1"
cl_radar_scale "0.45"
cl_radar_square_with_scoreboard "1"

// ============================================================
// HUD
// ============================================================

hud_scaling "0.90"

cl_showloadout "1"
cl_teamcounter_playercount_instead_of_avatars "true"
cl_teamid_overhead_colors_show "1"

gameinstructor_enable "0"

// ============================================================
// LOAD CONFIRMATION
// ============================================================

echo "CS2 Config Tools - generic autoexec loaded"
