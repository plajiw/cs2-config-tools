// ============================================================
// PLAJIW - CS2 AUTOEXEC
// ============================================================

unbindall

// ============================================================
// PERFORMANCE / VIDEO
// ============================================================

r_fullscreen_gamma "2.5"
r_player_visibility_mode "true"
r_drawtracers_firstperson "true"

fps_max "0"
fps_max_ui "60"

// ============================================================
// NETWORK / MATCHMAKING
// ============================================================

mm_dedicated_search_maxping "40"
rate "1000000"

// ============================================================
// TELEMETRY
// ============================================================

cl_hud_telemetry_frametime_show "2"
cl_hud_telemetry_ping_show "2"
cl_hud_telemetry_net_misdelivery_show "1"

// ============================================================
// GAMEPLAY
// ============================================================

con_enable "true"

cl_prefer_lefthanded "false"
cl_sniper_auto_rezoom "true"
cl_use_opens_buy_menu "false"
cl_silencer_mode "false"

option_duck_method "false"
option_speed_method "false"

// ============================================================
// MOUSE
// ============================================================

sensitivity "1.40"
zoom_sensitivity_ratio "1.0"

// ============================================================
// MOVEMENT
// ============================================================

bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"

bind "CTRL" "+duck"
bind "SHIFT" "+sprint"

bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"
bind "SPACE" "+jump"

// ============================================================
// WEAPONS / ACTIONS
// ============================================================

bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "player_ping"

bind "q" "lastinv"
bind "r" "+reload"
bind "e" "+use"
bind "g" "drop"

bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"

bind "z" "slot10"
bind "x" "slot8"
bind "c" "slot7"
bind "c" "slot9"

// ============================================================
// COMMUNICATION
// ============================================================

bind "v" "+voicerecord"
bind "o" "messagemode2"
bind "p" "messagemode"

// ============================================================
// BUY BINDS
// ============================================================

bind "kp_1" "buy deagle"
bind "kp_0" "buy vest"
bind "kp_divide" "buy smokegrenade"
bind "kp_2" "buy m4a1; buy ak47"
bind "kp_multiply" "buy hegrenade"
bind "kp_3" "buy awp"
bind "kp_del" "buy vesthelm; buy vest"
bind "kp_minus" "buy flashbang"
bind "kp_plus" "buy molotov; buy incgrenade"
bind "kp_enter" "buy defuser"

// ============================================================
// AUDIO
// ============================================================

snd_mute_losefocus "false"
snd_voipvolume "0.5"

snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundaction_volume "0"
snd_roundend_volume "0.16"
snd_mvp_volume "0.16"
snd_tensecondwarning_volume "0.04"
snd_mapobjective_volume "0.04"

// ============================================================
// CROSSHAIR
// ============================================================

cl_crosshairstyle "4"
cl_crosshairsize "2"
cl_crosshairthickness "1"
cl_crosshairgap "-3"
cl_crosshairgap_useweaponvalue "false"

cl_crosshair_t "false"
cl_crosshair_recoil "false"

cl_crosshaircolor "2"
cl_crosshairalpha "255"
cl_crosshairusealpha "true"
cl_crosshair_drawoutline "false"

// ============================================================
// VIEWMODEL
// ============================================================

viewmodel_presetpos "3"
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-2"

// ============================================================
// RADAR
// ============================================================

cl_hud_radar_scale "1.15"
cl_radar_always_centered "0"
cl_radar_icon_scale_min "0.5"
cl_radar_rotate "1"
cl_radar_scale "0.45"
cl_radar_square_with_scoreboard "1"

// ============================================================
// HUD
// ============================================================

hud_scaling "0.90"

cl_allow_animated_avatars "false"
cl_autohelp "0"
cl_hud_color "2"
cl_showloadout "1"

cl_teamcounter_playercount_instead_of_avatars "true"
cl_teamid_overhead_colors_show "1"
cl_teamid_overhead_maxdist "6000"

gameinstructor_enable "0"
r_show_build_info "false"

// ============================================================
// PRACTICE
// ============================================================

bind "k" "exec practice.cfg"

// ============================================================
// CONSOLE
// ============================================================

bind "`" "toggleconsole"

// ============================================================
// LOAD CONFIRMATION
// ============================================================

clear
echo "============================================================"
echo "  plajiw autoexec loaded"
echo "============================================================"
